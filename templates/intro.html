<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBAC Dashboard - Loading...</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/neon.css') }}" rel="stylesheet">
  <style>
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .loading-spinner {
      width: 5rem;
      height: 5rem;
      border: 0.5rem solid rgba(0, 173, 255, 0.2);
      border-radius: 50%;
      border-top-color: #00adff;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 2rem;
    }
    .loading-text {
      color: #00adff;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 173, 255, 0.5);
      letter-spacing: 2px;
      margin-top: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .neon-pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { text-shadow: 0 0 5px #00adff, 0 0 10px #00adff; }
      50% { text-shadow: 0 0 15px #00adff, 0 0 30px #00adff; }
      100% { text-shadow: 0 0 5px #00adff, 0 0 10px #00adff; }
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-text neon-pulse">RBAC Dashboard</div>
  </div>

  <script>
    // Show loading screen for 3 seconds, then redirect to dashboard
    setTimeout(function() {
      document.querySelector('.loading-container').style.opacity = '0';
      setTimeout(function() {
        window.location.href = '{{ url_for("dashboard") }}';
      }, 500);
    }, 3000);
  </script>
</body>
</html>
