<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RBAC Security Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/neon.css') }}" rel="stylesheet">
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-expand-lg neon-bar shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand neon-brand" href="{{ url_for('dashboard') }}"><i class="fa-solid fa-shield-halved me-2"></i>RBAC Dashboard</a>
      <div>
        <a class="btn btn-neon me-2" href="{{ url_for('users') }}"><i class="fa-solid fa-users me-1"></i>Users</a>
        <a class="btn btn-neon me-2" href="{{ url_for('roles') }}"><i class="fa-solid fa-user-shield me-1"></i>Roles</a>
        <a class="btn btn-neon me-2" href="{{ url_for('audit') }}"><i class="fa-solid fa-clipboard-list me-1"></i>Audit</a>
        <button id="refreshBtn" class="btn btn-neon" title="Refresh Page">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'info' if category=='info' else category }} fade show neon-alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
